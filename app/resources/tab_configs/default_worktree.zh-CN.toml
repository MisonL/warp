# 默认 worktree 标签页配置
# 存储在 ~/.warp/default_tab_configs/，你可以自定义此文件。
# 从“新建 worktree 配置”流程创建的新 worktree 配置都会使用这些自定义内容。
#
# "Worktree in" 子菜单会使用此配置，为已知仓库在
# ~/.warp/worktrees/<repo-name>/<worktree-name> 下快速创建 worktree。

name = "Worktree"
name_zh_CN = "工作树"

[[panes]]
id = "main"
type = "{{pane_type}}"
directory = "{{repo}}"
commands = [
  "git worktree add -b {{autogenerated_branch_name}} {{worktree_path_prefix}}{{autogenerated_branch_name}}",
  "cd {{worktree_path_prefix}}{{autogenerated_branch_name}}",
]

[params.repo]
type = "repo"
description = "Repository to create worktree in"
description_zh_CN = "要在其中创建 worktree 的仓库"

[params.pane_type]
type = "text"
description = "Pane type (terminal or agent)"
description_zh_CN = "窗格类型（terminal 或 agent）"
default = "terminal"
